<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Tabela Verdade A3</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px}
.container{max-width:1400px;margin:auto;background:#fff;padding:25px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.15)}
h2,h3{text-align:center;margin:5px}
.infoBox{background:#f8f8f8;border-left:4px solid #0078ff;padding:10px;margin:15px 0}
input{width:100%;padding:12px;font-size:18px;box-sizing:border-box}
button{margin-top:10px;padding:12px 20px;background:#0078ff;color:#fff;border:none;border-radius:5px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#0078ff;color:white}
.erro{color:red;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h2>A3 Matemática Computacional Aplicada</h2>
<h3>Universidade Potiguar (UnP)</h3>

<div class="infoBox">
<b>Operadores:</b><br>
. = AND &nbsp;&nbsp; + = OR &nbsp;&nbsp; - = NOT<br><br>
<b>Até 3 resultados:</b><br>
(A.B)+C / A.C / (-A.B)+C<br><br>
<b>Limite:</b> 8 variáveis (256 combinações).
</div>

<input id="expressao" placeholder="Digite a expressão lógica">
<button onclick="gerarTabela()">Gerar Tabela Verdade</button>

<div id="erro" class="erro"></div>
<div id="info"></div>
<div id="resultado"></div>
</div>

<script>
function validarExpressao(texto){
    if(!texto.trim()) return "Digite uma expressão.";
    const partes = texto.split("/").map(x=>x.trim()).filter(x=>x);
    if(partes.length>3) return "Máximo de 3 resultados (X1, X2 e X3).";
    return null;
}

function obterVariaveis(texto){
    const letras = texto.match(/[A-Z]/g) || [];
    return [...new Set(letras)].sort();
}

function converter(expr){
    expr = expr.replace(/\\s+/g,'');
    expr = expr.replace(/\\./g,'&&');
    expr = expr.replace(/\\+/g,'||');
    expr = expr.replace(/-([A-Z])/g,'!$1');
    return expr;
}

function calcular(expr,valores){
    let e = expr;
    for(const v in valores){
        e = e.replaceAll(v,valores[v]);
    }
    try{
        return eval(e) ? 1 : 0;
    }catch{
        return "Erro";
    }
}

function gerarTabela(){

    document.getElementById("erro").innerHTML="";
    document.getElementById("resultado").innerHTML="";
    document.getElementById("info").innerHTML="";

    const entrada=document.getElementById("expressao").value.trim();

    const erro=validarExpressao(entrada);
    if(erro){
        document.getElementById("erro").innerHTML=erro;
        return;
    }

    const funcoes=entrada.split("/").map(x=>x.trim()).filter(x=>x);

    const variaveis=obterVariaveis(entrada);

    if(variaveis.length===0){
        document.getElementById("erro").innerHTML="Nenhuma variável encontrada.";
        return;
    }

    if(variaveis.length>8){
        document.getElementById("erro").innerHTML="Limite excedido. Máximo de 8 variáveis (256 combinações).";
        return;
    }

    const total=Math.pow(2,variaveis.length);
    const funcoesJS=funcoes.map(converter);

    let html="<table><thead><tr>";

    variaveis.forEach(v=>{
        html+=`<th>${v}</th>`;
    });

    for(let i=0;i<funcoes.length;i++){
        html+=`<th>X${i+1}</th>`;
    }

    html+="</tr></thead><tbody>";

    for(let linha=0;linha<total;linha++){

        html+="<tr>";
        const valores={};

        variaveis.forEach((v,index)=>{
            const bit=(linha>>(variaveis.length-index-1))&1;
            valores[v]=Boolean(bit);
            html+=`<td>${bit}</td>`;
        });

        funcoesJS.forEach(f=>{
            html+=`<td>${calcular(f,valores)}</td>`;
        });

        html+="</tr>";
    }

    html+="</tbody></table>";

    document.getElementById("resultado").innerHTML=html;
    document.getElementById("info").innerHTML=
        `Variáveis: ${variaveis.length} | Combinações: ${total} | Resultados: ${funcoes.length}`;
}
</script>
</body>
</html>
